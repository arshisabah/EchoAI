<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoAI Backend Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e8ed;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        .status.connected {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.disconnected {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .status.processing {
            background: #feebc8;
            color: #7c2d12;
        }
        
        .log-container {
            background: #1a202c;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #4a5568;
        }
        
        .log-entry.success {
            border-left-color: #48bb78;
        }
        
        .log-entry.error {
            border-left-color: #f56565;
        }
        
        .log-entry.info {
            border-left-color: #4299e1;
        }
        
        .transcript-entry {
            background: #f7fafc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .transcript-entry .speaker {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .transcript-entry .text {
            color: #2d3748;
        }
        
        .transcript-entry .meta {
            font-size: 11px;
            color: #718096;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ EchoAI Backend Test Client</h1>
            <p>Interactive testing interface for real-time transcription backend</p>
        </div>

        <div class="grid">
            <!-- Connection Control -->
            <div class="card">
                <h2>🔌 Connection</h2>
                <div class="input-group">
                    <label>Session ID</label>
                    <input type="text" id="sessionId" value="test-session-001" placeholder="Enter session ID">
                </div>
                <div id="connectionStatus" class="status disconnected">
                    ❌ Disconnected
                </div>
                <div class="button-group">
                    <button class="btn-success" onclick="connectWebSocket()">Connect</button>
                    <button class="btn-danger" onclick="disconnectWebSocket()">Disconnect</button>
                </div>
            </div>

            <!-- REST API Tests -->
            <div class="card">
                <h2>🌐 REST API Tests</h2>
                <div class="button-group">
                    <button class="btn-primary" onclick="testHealth()">Health Check</button>
                    <button class="btn-primary" onclick="testCreateSession()">Create Session</button>
                    <button class="btn-primary" onclick="testGetTranscript()">Get Transcript</button>
                    <button class="btn-primary" onclick="testAnalytics()">Get Analytics</button>
                    <button class="btn-danger" onclick="testDeleteSession()">Delete Session</button>
                </div>
            </div>

            <!-- Audio Recording -->
            <div class="card">
                <h2>🎤 Audio Recording</h2>
                <div id="recordingStatus" class="status disconnected">
                    ⏹️ Not Recording
                </div>
                <div class="button-group">
                    <button class="btn-success" onclick="startRecording()">Start Recording</button>
                    <button class="btn-danger" onclick="stopRecording()">Stop Recording</button>
                    <button class="btn-warning" onclick="sendTestAudio()">Send Test Audio</button>
                </div>
            </div>
        </div>

        <!-- Transcript Display -->
        <div class="card">
            <h2>📝 Live Transcript</h2>
            <div id="transcriptContainer">
                <p style="color: #718096;">Transcripts will appear here...</p>
            </div>
        </div>

        <!-- Logs -->
        <div class="card">
            <h2>📊 Activity Log</h2>
            <button class="btn-danger" onclick="clearLogs()" style="margin-bottom: 10px;">Clear Logs</button>
            <div id="logContainer" class="log-container"></div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        const WS_URL = 'ws://localhost:8000';
        
        let ws = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ================ LOGGING ================
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
        }

        // ================ WEBSOCKET ================
        function connectWebSocket() {
            const sessionId = document.getElementById('sessionId').value;
            if (!sessionId) {
                log('Please enter a session ID', 'error');
                return;
            }

            log(`Connecting to WebSocket for session: ${sessionId}`, 'info');
            
            ws = new WebSocket(`${WS_URL}/transcript/ws/${sessionId}`);
            
            ws.onopen = () => {
                log('✅ WebSocket connected', 'success');
                updateConnectionStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`Received: ${data.type}`, 'info');
                handleWebSocketMessage(data);
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error.message || 'Unknown error'}`, 'error');
            };

            ws.onclose = () => {
                log('WebSocket disconnected', 'info');
                updateConnectionStatus(false);
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.className = 'status connected';
                status.textContent = '✅ Connected';
            } else {
                status.className = 'status disconnected';
                status.textContent = '❌ Disconnected';
            }
        }

        function handleWebSocketMessage(data) {
            if (data.type === 'transcript_entry') {
                displayTranscript(data.data);
            } else if (data.type === 'pong') {
                log('Pong received', 'success');
            }
        }

        function displayTranscript(entry) {
            const container = document.getElementById('transcriptContainer');
            
            // Clear placeholder
            if (container.querySelector('p')) {
                container.innerHTML = '';
            }

            const transcriptDiv = document.createElement('div');
            transcriptDiv.className = 'transcript-entry';
            
            transcriptDiv.innerHTML = `
                <div class="speaker">${entry.speaker || 'Unknown'}</div>
                <div class="text">${entry.text}</div>
                <div class="meta">
                    Confidence: ${(entry.confidence * 100).toFixed(1)}% | 
                    ${entry.emotion ? `Emotion: ${entry.emotion}` : ''} | 
                    ${new Date(entry.timestamp).toLocaleTimeString()}
                </div>
            `;
            
            container.insertBefore(transcriptDiv, container.firstChild);
            log(`Transcript: "${entry.text.substring(0, 50)}..."`, 'success');
        }

        // ================ AUDIO RECORDING ================
        async function startRecording() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Please connect WebSocket first', 'error');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 16000
                    } 
                });

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                        const arrayBuffer = await event.data.arrayBuffer();
                        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                        
                        ws.send(JSON.stringify({
                            type: 'audio_chunk',
                            audio_data: base64Audio,
                            sample_rate: 16000
                        }));
                        
                        log('Sent audio chunk', 'info');
                    }
                };

                mediaRecorder.start(1000); // Send chunks every 1 second
                isRecording = true;
                updateRecordingStatus(true);
                log('🎤 Recording started', 'success');

            } catch (error) {
                log(`Failed to start recording: ${error.message}`, 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                updateRecordingStatus(false);
                log('⏹️ Recording stopped', 'info');
            }
        }

        function updateRecordingStatus(recording) {
            const status = document.getElementById('recordingStatus');
            if (recording) {
                status.className = 'status processing';
                status.textContent = '🎤 Recording...';
            } else {
                status.className = 'status disconnected';
                status.textContent = '⏹️ Not Recording';
            }
        }

        function sendTestAudio() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Please connect WebSocket first', 'error');
                return;
            }

            // Generate 1 second of test audio (sine wave)
            const sampleRate = 16000;
            const duration = 1.0;
            const frequency = 440; // A4 note
            
            const samples = sampleRate * duration;
            const audio = new Int16Array(samples);
            
            for (let i = 0; i < samples; i++) {
                audio[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * 0.3 * 32767;
            }
            
            const base64Audio = btoa(String.fromCharCode(...new Uint8Array(audio.buffer)));
            
            ws.send(JSON.stringify({
                type: 'audio_chunk',
                audio_data: base64Audio,
                sample_rate: sampleRate
            }));
            
            log('Sent test audio (sine wave)', 'info');
        }

        // ================ REST API TESTS ================
        async function testHealth() {
            log('Testing health endpoint...', 'info');
            try {
                const response = await fetch(`${BASE_URL}/health`);
                const data = await response.json();
                log(`✅ Health check: ${data.status}`, 'success');
            } catch (error) {
                log(`❌ Health check failed: ${error.message}`, 'error');
            }
        }

        async function testCreateSession() {
            const sessionId = document.getElementById('sessionId').value;
            log(`Creating session: ${sessionId}`, 'info');
            
            try {
                const response = await fetch(`${BASE_URL}/transcript/session/${sessionId}/create`, {
                    method: 'POST'
                });
                const data = await response.json();
                log(`✅ Session created: ${data.session_id || sessionId}`, 'success');
            } catch (error) {
                log(`❌ Failed to create session: ${error.message}`, 'error');
            }
        }

        async function testGetTranscript() {
            const sessionId = document.getElementById('sessionId').value;
            log(`Getting transcript for: ${sessionId}`, 'info');
            
            try {
                const response = await fetch(`${BASE_URL}/transcript/session/${sessionId}`);
                const data = await response.json();
                log(`✅ Transcript retrieved: ${data.total_entries || 0} entries`, 'success');
            } catch (error) {
                log(`❌ Failed to get transcript: ${error.message}`, 'error');
            }
        }

        async function testAnalytics() {
            const sessionId = document.getElementById('sessionId').value;
            log(`Getting analytics for: ${sessionId}`, 'info');
            
            try {
                const response = await fetch(`${BASE_URL}/analytics/session/${sessionId}`);
                const data = await response.json();
                log(`✅ Analytics retrieved: ${JSON.stringify(data).substring(0, 100)}...`, 'success');
            } catch (error) {
                log(`❌ Failed to get analytics: ${error.message}`, 'error');
            }
        }

        async function testDeleteSession() {
            const sessionId = document.getElementById('sessionId').value;
            
            if (!confirm(`Delete session ${sessionId}?`)) return;
            
            log(`Deleting session: ${sessionId}`, 'info');
            
            try {
                const response = await fetch(`${BASE_URL}/transcript/session/${sessionId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                log(`✅ Session deleted`, 'success');
                document.getElementById('transcriptContainer').innerHTML = '<p style="color: #718096;">Transcripts will appear here...</p>';
            } catch (error) {
                log(`❌ Failed to delete session: ${error.message}`, 'error');
            }
        }

        // Initialize
        log('Test client ready. Enter a session ID and click Connect to start.', 'info');
    </script>
</body>
</html>
